name: JARVIS Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Verify Gradle
        run: gradle --version

      - name: Validate Android project
        working-directory: android
        run: gradle --no-daemon help

      - name: Run source tests
        run: bash scripts/run_tests.sh

      - name: Run Android tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep -o "versionName '[^']*'" android/app/build.gradle | cut -d "'" -f2)
          CODE=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "artifact=jarvis-v$VERSION-debug-apk" >> "$GITHUB_OUTPUT"

      - name: Create APK verification files
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" > "$APK.sha256"
          {
            echo "JARVIS_VERSION=${{ steps.app_version.outputs.version }}"
            echo "VERSION_CODE=${{ steps.app_version.outputs.code }}"
            echo "BUILD_TYPE=debug"
            echo "GIT_COMMIT=$GITHUB_SHA"
            echo "BUILD_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
          } > android/app/build/outputs/apk/debug/build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_version.outputs.artifact }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14
